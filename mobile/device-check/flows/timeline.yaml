# Home and the notes list on a fresh install: the app opens on Home with sending off and no notes.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# A row's label joins its name, its status and its count, so match inside it.
- assertVisible: 'Notes(.|\n)*'
# One Notes row: no Voice notes or Shares folder.
- assertNotVisible: 'Voice notes(.|\n)*'
- assertNotVisible: 'Shares(.|\n)*'
- assertVisible: 'Location(.|\n)*Off(.|\n)*'
# Sign-in and connections live in Settings now, not on Home.
- assertNotVisible: 'Connections(.|\n)*'
# New note is a round button with no visible words: Maestro finds it by its accessibility label.
- assertVisible: "New note"
- assertVisible: "Search"
- takeScreenshot: home
- tapOn: 'Notes(.|\n)*'
- extendedWaitUntil:
    visible: 'No notes yet(.|\n)*'
    timeout: 30000
# With sending off, the line under the title gives the count alone: no state, and no Sync now.
# The title and its line read as one label: "Notes", then "No notes". The match is the whole label, so no state word
# such as "On this phone" is in it; the empty list's hint says "on this phone" by design.
- assertVisible: 'Notes\nNo notes'
- assertNotVisible: "Sync now"
- assertVisible: "New note"
- takeScreenshot: timeline
