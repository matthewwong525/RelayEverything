# Settings: open it from the gear on Home. Signed out, its first row is the account card, Sign in to Relay Everything,
# then the Appearance, Notes and Voice notes groups. A tap on the card opens the Sign in screen. Then the flow saves a
# webhook with no account, which checks only the address's form, with no network, and the webhook Account page offers
# Sign in to Relay Everything and Stop sending.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# The round gear has no visible words: Maestro finds it by its tooltip, Settings.
- tapOn: "Settings"
# Wait for a word only Settings shows.
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 30000
- assertVisible: "System"
- assertVisible: "Dark"
- assertVisible: "Voice notes"
- assertNotVisible: 'Pin notes to where I am(.|\n)*'
# The account card joins its title and its line, Your notes stay on this phone until you sign in.
- assertVisible: 'Sign in to Relay Everything(.|\n)*'
- assertNotVisible: 'Send my notes(.|\n)*'
- takeScreenshot: settings
# The account card opens the Sign in screen: one Sign in button and one quiet link to a webhook with no account. The
# link's ? is escaped, because Maestro reads the text as a regular expression.
- tapOn: 'Sign in to Relay Everything(.|\n)*'
- extendedWaitUntil:
    visible: 'Don''t want an account\? Use your own webhook'
    timeout: 30000
- assertVisible: "Sign in"
- assertNotVisible: "Scan a key"
- assertNotVisible: "Use another server"
- takeScreenshot: sign-in
# The webhook setup has four numbered steps. The address field keeps the label Address and starts as https://, so
# type the rest, then Save. Save, step 4, sits under the keyboard, and Flutter's keyboard has no dismiss action
# Maestro's hideKeyboard can use, so scroll the page up to it first. A slow Mac takes about 10 seconds to read each
# screen here, so the scroll gets 40 seconds, not 20: it ends as soon as Save shows.
- tapOn: 'Don''t want an account\? Use your own webhook'
- extendedWaitUntil:
    visible: "My own webhook"
    timeout: 30000
- assertVisible: "1. Your webhook's address"
- tapOn: "Address"
- inputText: "example.com/hook"
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn: "Save"
# A new install has no notes, so the earlier-notes question shows only if a note was kept.
- tapOn:
    text: "Only new notes"
    optional: true
# Back in Settings, the account card joins My own webhook and the webhook's host, and opens Account.
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 30000
- tapOn: 'My own webhook(.|\n)*'
- extendedWaitUntil:
    visible: 'Stop sending(.|\n)*'
    timeout: 30000
- assertVisible: 'Sign in to Relay Everything(.|\n)*'
- assertNotVisible: 'Notes from elsewhere(.|\n)*'
- takeScreenshot: webhook-account
