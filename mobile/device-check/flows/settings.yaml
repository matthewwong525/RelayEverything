# Settings: open it from the gear on Home; it holds the Appearance, Notes and Voice notes groups. Sending has its own
# folder on Home.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# The round gear has no visible words: Maestro finds it by its tooltip, Settings.
- tapOn: "Settings"
# Home has a Voice notes folder too, so wait for a word only Settings shows.
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- assertVisible: "System"
- assertVisible: "Dark"
- assertVisible: "Voice notes"
# Flutter joins a row's title and subtitle into one label, so match its start.
- assertVisible: 'Pin notes to where I am(.|\n)*'
- assertNotVisible: 'Send my notes(.|\n)*'
- takeScreenshot: settings
# Back on Home, Sending opens its own page, with the sending switch off.
# The back button's label joins its tooltip, Back, and the page it names, Home.
- tapOn: '(.|\n)*Home(.|\n)*'
# Sending sits low on Home, under Search and New note on a small screen: scroll it to the middle first.
- scrollUntilVisible:
    element: 'Sending(.|\n)*'
    direction: DOWN
    centerElement: true
- tapOn: 'Sending(.|\n)*'
- extendedWaitUntil:
    visible: 'Send my notes(.|\n)*'
    timeout: 10000
- takeScreenshot: sending
