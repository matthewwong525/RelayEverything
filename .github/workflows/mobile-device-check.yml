# The iPhone device check: build, open, the fixed tour, then Claude tries the change; a second Mac runs the Swift tests.
# Job tour-report posts the tour's result on the pull request as soon as it is known.
# Starts only by hand or by the "check on iPhone" label: wiki/development/device-check.md. A release calls it with
# tour_only: the tour and the Swift tests alone, as a gate, with no Claude.
name: Mobile device check
on:
  workflow_call:
    inputs:
      sha:
        description: The commit to check.
        required: true
        type: string
      tour_only:
        description: Run the fixed tour with no Claude, and fail unless every step of it passes.
        required: false
        type: boolean
        default: false
  # GitHub starts this by hand only once the file is on the default branch; before that, the label is the only start.
  workflow_dispatch:
    inputs:
      sha:
        description: The saved commit to check. The run fails if the branch head is a different commit.
        required: true
        type: string
      pr:
        description: The pull request that gets the report, if any.
        required: false
        type: string
      scenarios:
        description: What Claude tries, in plain words. Empty means the open change's phone app scenarios.
        required: false
        type: string
      model:
        description: The model Claude uses.
        required: false
        type: string
        default: claude-sonnet-5-5
      flows:
        description: Extra tour steps from mobile/device-check/flows/, by name, split by spaces, such as voice-note.
        required: false
        type: string
      passed_before:
        description: The last check's link, then one scenario name per line that passed there and is not tried again.
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  iphone:
    # The label start runs only for a branch in this repository, so a fork's code never gets the key.
    if: >-
      ${{ inputs.tour_only || github.event_name == 'workflow_dispatch' || (github.event.label.name == 'check on iPhone'
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # A newer check of the branch stops this one; a release's tour is never stopped.
    concurrency:
      group: device-check-iphone-${{ inputs.tour_only && format('release-{0}', inputs.sha) || github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ !inputs.tour_only }}
    env:
      APP_ID: com.matthewwong525.relayApp
      OUT: ${{ github.workspace }}/out
      EXPECTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
      CLAUDE_MAX_TURNS: 80
      # Maestro's iPhone driver once took longer than its 120 s default to start (run 42494210887).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check the commit
        env:
          FLOWS: ${{ inputs.flows }}
        run: |
          mkdir -p "$OUT"
          head=$(git rev-parse HEAD)
          echo "$head" > "$OUT/commit.txt"
          stop() {
            echo could-not-check > "$OUT/verdict.txt"
            echo "$1" > "$OUT/reason.txt"
            echo "::error::$1"
            exit 1
          }
          if [ "$head" != "$EXPECTED_SHA" ]; then
            stop "The branch is at $head, not at the saved commit $EXPECTED_SHA. Save again, then start the check."
          fi
          for flow in $FLOWS; do
            if ! [[ "$flow" =~ ^[a-z0-9-]+$ ]] || [ ! -f "mobile/device-check/flows/$flow.yaml" ]; then
              stop "The tour step \"$flow\" is not in mobile/device-check/flows/ at this commit."
            fi
          done

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.12.1
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          zip="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      # The iPhone boots while the app builds, after the Flutter download: both at once slow each other.
      - name: Start an iPhone
        id: boot
        run: bash mobile/device-check/iphone-boot.sh

      - name: Build for the simulator
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          # The watch app inside needs the iPhone's id: Flutter refuses a simulator build of a watch companion without it.
          if flutter pub get 2>&1 | tee "$OUT/build.log" && flutter build ios --simulator --debug -d "$DEVICE_UDID" 2>&1 | tee -a "$OUT/build.log"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            bash device-check/broken.sh "The app does not build for the simulator." "$OUT/build.log"
          fi

      - name: Open the app on an iPhone
        id: open
        if: steps.build.outputs.ok == 'true' && steps.boot.outputs.ok == 'true'
        run: bash mobile/device-check/iphone-open.sh

      - name: Fixed tour
        id: tour
        if: steps.open.outputs.ok == 'true'
        env:
          # A release's tour runs the fixed steps alone.
          EXTRA_FLOWS: ${{ !inputs.tour_only && inputs.flows || '' }}
        run: bash mobile/device-check/tour.sh

      # Job tour-report reads this while the run goes on, so the pull request learns the tour's result early.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.tour.outcome != 'skipped'
        with:
          name: device-check-tour
          path: |
            out/tour.json
            out/tour/
            out/reason.txt
            out/crash.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tour only
        if: inputs.tour_only
        run: |
          echo "Claude skipped: a release runs the fixed tour only" > "$OUT/claude-skipped.txt"

      - name: Claude's key
        id: key
        if: steps.tour.outputs.ok == 'true' && !inputs.tour_only
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != true ]; then echo "Claude skipped: no key" > "$OUT/claude-skipped.txt"; fi

      - name: Brief for Claude
        id: brief
        if: steps.key.outputs.ready == 'true'
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: bash mobile/device-check/brief.sh mobile/device-check/iphone.md

      - name: Claude tries the change
        id: claude
        if: steps.key.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          # Keeps the key out of every command Claude runs, so screen text can't send it anywhere.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # 5 minutes per command, so flow.sh's hung run (120 s) and its retry finish before the Bash tool stops it.
          BASH_DEFAULT_TIMEOUT_MS: "300000"
        with:
          prompt: ${{ steps.brief.outputs.text }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's read-only token, so Claude gets no write token from the Claude GitHub app.
          github_token: ${{ github.token }}
          claude_args: >-
            --model ${{ steps.brief.outputs.model }}
            --max-turns ${{ env.CLAUDE_MAX_TURNS }}
            --allowedTools "Bash(xcrun simctl:*),Bash(bash mobile/device-check/flow.sh:*),Bash(mkdir -p:*),Bash(ls:*),Bash(sleep:*),Read,Glob,Grep,Edit(./out/claude/**),Write(./out/claude/**)"
            --disallowedTools "Bash(xcrun simctl spawn:*)"

      # The action keeps its log only in the runner's temp folder, and only when Claude ends on its own; without it,
      # steps.mjs reads Claude Code's session file, which it writes as it goes.
      - name: Claude's steps
        if: always() && steps.key.outputs.ready == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: node mobile/device-check/steps.mjs --file "$EXECUTION_FILE" --out "$OUT/claude" --max-turns "$CLAUDE_MAX_TURNS"

      - name: Stop the video
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/crashes.pid" ] && { kill "$(cat "$RUNNER_TEMP/crashes.pid")" 2>/dev/null || true; }
          [ -f "$RUNNER_TEMP/video.pid" ] || exit 0
          pid=$(cat "$RUNNER_TEMP/video.pid")
          kill -INT "$pid" 2>/dev/null || true
          for _ in $(seq 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done

      - name: Report
        if: always()
        env:
          PASSED_BEFORE: ${{ inputs.passed_before }}
        run: bash mobile/device-check/finish.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-check-iphone
          path: out/
          if-no-files-found: error
          retention-days: 14

      # The release gate: it reads each step of tour.json and the verdict, so a release never goes on past a failed or
      # missing step, or a failed build. A failed Swift test fails job swift-tests, which stops the release too.
      - name: Every tour step passed
        if: always() && inputs.tour_only
        run: |
          if [ "$(cat "$OUT/verdict.txt" 2>/dev/null)" = broken ]; then
            echo "::error::$(cat "$OUT/reason.txt" 2>/dev/null || echo 'The check is broken.') The release stops. The file device-check-iphone shows why."
            exit 1
          fi
          if [ ! -s "$OUT/tour.json" ] || [ "$(jq length "$OUT/tour.json")" -eq 0 ]; then
            echo "::error::The fixed tour did not run, so the release stops. The file device-check-iphone shows why."
            exit 1
          fi
          failed=$(jq -r '[.[] | select(.passed != true) | .flow] | join(", ")' "$OUT/tour.json")
          if [ -n "$failed" ]; then
            echo "::error::A step of the fixed tour failed: $failed. The release stops. The file device-check-iphone has the pictures."
            exit 1
          fi
          echo "Every step of the fixed tour passed."

  # The Swift rules against the Dart ones (RunnerTests) and the watch app's (RelayWatchTests), on a second Mac at the
  # same time as job iphone.
  swift-tests:
    if: >-
      ${{ inputs.tour_only || github.event_name == 'workflow_dispatch' || (github.event.label.name == 'check on iPhone'
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: device-check-swift-${{ inputs.tour_only && format('release-{0}', inputs.sha) || github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ !inputs.tour_only }}
    env:
      OUT: ${{ github.workspace }}/out
      EXPECTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check the commit
        run: |
          mkdir -p "$OUT"
          head=$(git rev-parse HEAD)
          if [ "$head" != "$EXPECTED_SHA" ]; then
            echo "::error::The branch is at $head, not at the saved commit $EXPECTED_SHA. Save again, then start the check."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - name: Start an iPhone
        id: boot
        run: |
          bash mobile/device-check/iphone-boot.sh
          if [ -f "$OUT/reason.txt" ]; then echo "::error::$(cat "$OUT/reason.txt")"; exit 1; fi

      # `failed` is written only when xcodebuild ends with a failure, so tests that never finished are no failure.
      - name: Swift tests
        working-directory: mobile
        run: |
          set -o pipefail
          flutter pub get
          flutter build ios --simulator --debug --config-only
          result=passed
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "id=$DEVICE_UDID" \
            -only-testing:RunnerTests 2>&1 | tee "$OUT/swift-tests.log" | tail -n 40 || result=failed
          bash device-check/watch-tests.sh || result=failed
          echo "$result" > "$OUT/swift-tests.txt"
          [ "$result" = passed ]

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-check-swift
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # Posts the tour's result on the pull request as soon as job iphone uploads device-check-tour, about 15 minutes in,
  # while Claude still works. It checks out no code and stops with no note when job iphone ends with no tour.
  tour-report:
    if: >-
      ${{ !inputs.tour_only && (inputs.pr || github.event.pull_request.number) && (github.event_name == 'workflow_dispatch'
      || (github.event.label.name == 'check on iPhone' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: device-check-tour-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Wait for the tour
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for _ in $(seq 80); do
            id=$(gh api "$RUN/artifacts" --jq '.artifacts[] | select(.name == "device-check-tour") | .id' 2>/dev/null | head -n 1 || true)
            if [ -n "$id" ]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > tour.zip && unzip -q -o tour.zip -d tour
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            state=$(gh api "$RUN/jobs" --jq '.jobs[] | select(.name == "iphone") | .status' 2>/dev/null || true)
            # One more look after the Mac ends: its upload and its end can land in the same 30 s.
            if [ "$state" = completed ]; then
              if [ -n "${last:-}" ]; then echo "Job iphone ended with no tour."; exit 0; fi
              last=true
            fi
            sleep 30
          done
          echo "No tour after 40 minutes."

      - name: Post the tour's result
        if: steps.wait.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then echo "::error::pr must be a pull request number."; exit 1; fi
          cd tour
          failed=$(jq -r '[.[] | select(.passed | not) | .flow] | join(", ")' tour.json 2>/dev/null)
          second=$(jq -r '[.[] | select(.passed and .tries == 2) | .flow] | join(", ")' tour.json 2>/dev/null)
          {
            if [ -s tour.json ] && [ -z "$failed" ] && [ ! -s crash.txt ]; then
              echo "**iPhone check: the tour passed** ($(jq length tour.json) steps). Claude is checking the change now."
              if [ -n "$second" ]; then echo; echo "Passed on the second try: $second."; fi
            else
              echo "**iPhone check: broken** at the tour. Claude does not start."
              echo; head -c 2000 reason.txt 2>/dev/null || echo "The tour did not finish."
              if [ -s crash.txt ]; then echo; echo '```text'; head -c 4000 crash.txt; echo '```'; fi
            fi
            echo
            echo "The full report follows. Pictures: [the run]($RUN_URL), file \`device-check-tour\`."
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  # Posts the report on the pull request, except for a check a newer one stopped. It checks out no branch code, so the
  # write token never shares a machine with it: the same split as deploy.yml.
  report:
    needs: [iphone, swift-tests]
    if: >-
      ${{ always() && needs.iphone.result != 'skipped' && needs.iphone.result != 'cancelled'
      && (inputs.pr || github.event.pull_request.number) }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: device-check-iphone
          path: result

      - name: Post the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SWIFT: ${{ needs.swift-tests.result }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then echo "::error::pr must be a pull request number."; exit 1; fi
          case "$SWIFT" in
            success) swift="The Swift tests passed: the share card, the inbox and the watch app." ;;
            failure) swift="**The Swift tests failed.** The file \`device-check-swift\` has the logs." ;;
            *) swift="The Swift tests did not finish ($SWIFT)." ;;
          esac
          {
            if [ -f result/report.md ]; then head -c 60000 result/report.md; else echo "The iPhone check made no report. Open the run."; fi
            echo
            echo "$swift"
            echo
            echo "Pictures and video: [the run]($RUN_URL), file \`device-check-iphone\`."
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
