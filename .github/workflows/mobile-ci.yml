# The phone app in mobile/: test and build both apps. A branch sends nothing, main sends its newest build as a beta,
# and a v<x.y.z> tag on main releases the app (mobile/README.md). A pull request from a fork runs the tests only.
name: Mobile CI
on:
  push:
    branches: ['**']
    # GitHub reads no paths filter for a tag, so every release tag runs.
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/mobile-*.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-*.yml']
  workflow_dispatch:
    inputs:
      release_check:
        description: Run a release's every step, with a draft GitHub release that is deleted and no App Store review.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A same-repo pull request is already covered by its own push, as in test.yml. Main's runs go in order and keep only
# the newest waiting run; a tag has its own group, never cancelled.
concurrency:
  group: >-
    ${{ github.ref_type == 'tag' && format('mobile-release-{0}', github.ref_name)
    || format('mobile-ci-{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != github.event.repository.default_branch }}

jobs:
  # One build number for every run (github.run_number), and the version: the tag's for a release, else the next beta.
  # A bad tag, a tag off main, or a version not above the last release stops here, before any build.
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: plan
        env:
          RELEASE_CHECK: ${{ inputs.release_check }}
        run: |
          if ! out=$(node scripts/app-release.mjs version 2> "$RUNNER_TEMP/plan.err"); then
            echo "::error::$(cat "$RUNNER_TEMP/plan.err")"
            exit 1
          fi
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  flutter:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The note editor page (mobile/editor-web): its tests run in Chromium.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test the note editor page
        working-directory: mobile/editor-web
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          npm test
      - run: flutter test

  # The Relay Everything page, the app built for the web, as the file a self-hosted server downloads
  # (app/self-host/SETUP.md): main adds it to its pre-release, and a release to the release. A branch's web build runs
  # in the app's own build (deploy.yml), so it does not run here.
  web:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the file is named for the newest commit that changed mobile/.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: node scripts/build-relay-web.mjs --zip "$RUNNER_TEMP/relay-web"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-web
          path: ${{ runner.temp }}/relay-web
          if-no-files-found: error

  # The page goes with main's Android pre-release. When a newer commit on main changes mobile/, the Android job sends
  # nothing, and the newer run sends both.
  web-beta:
    needs: [plan, web, android]
    if: ${{ needs.plan.outputs.mode == 'beta' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-web
          path: ${{ runner.temp }}/relay-web
      - name: Add the page to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: mobile-v${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/relay-web/* --clobber
          else
            echo "::notice::No pre-release $TAG: a newer commit on main changes mobile/, and its own run sends the page."
          fi

  # A branch publishes nothing, so its builds start with the tests; main and a release build after them. GitHub's
  # needs can't depend on the mode, so each build has two jobs.
  android-branch:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'branch' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-android.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  ios-branch:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'branch' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/mobile-ios.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      upload: false
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  # The Mac app, unsigned, as a file to try in the run. It gets no secret: a branch never signs.
  macos-branch:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'branch' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/mobile-macos.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}

  android:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-android.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  ios:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/mobile-ios.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      upload: true
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  # The Mac app signed, checked by Apple and stapled, for the pre-release and the release.
  macos:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/mobile-macos.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  # The Mac app goes with main's Android pre-release, as the web page does. When a newer commit on main changes
  # mobile/, the Android job sends nothing, and the newer run sends both.
  macos-beta:
    needs: [plan, macos, android]
    if: ${{ needs.plan.outputs.mode == 'beta' && needs.macos.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-everything-mac
          path: ${{ runner.temp }}/mac
      - name: Add the Mac app to the pre-release
        id: send
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: mobile-v${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/mac/Relay-Everything-Mac.dmg" --clobber
            echo "sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pre-release $TAG: a newer commit on main changes mobile/, and its own run sends the Mac app."
          fi

  # The Mac app's update feed, after the file is on its own release: main's as a test build, a release's as a release;
  # a release check writes none. The fixed pre-release mac-updates keeps appcast.xml, the app's feed, and the newest
  # Relay-Everything-Mac.dmg, the website's download. One run writes the feed at a time, and none is cancelled.
  mac-feed:
    needs: [plan, macos-beta, release]
    if: >-
      ${{ !cancelled() && ((needs.plan.outputs.mode == 'beta' && needs.macos-beta.outputs.sent == 'true')
      || (needs.plan.outputs.mode == 'release' && needs.release.result == 'success')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: mac-feed
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      TAG: ${{ needs.plan.outputs.mode == 'release' && needs.plan.outputs.tag || format('mobile-v{0}+{1}', needs.plan.outputs.version, needs.plan.outputs.build) }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Full history: what is new comes from the commits since the last release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: relay-everything-mac
          path: ${{ runner.temp }}/mac
      - name: Update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          node scripts/app-release.mjs notes --version "$VERSION" --previous-tag="$PREVIOUS_TAG" --out "$RUNNER_TEMP"
          if ! gh release view mac-updates > /dev/null 2>&1; then
            gh release create mac-updates --prerelease --latest=false --target "$GITHUB_SHA" --title "Relay Everything for Mac: updates" \
              --notes "The Mac app's update feed and its newest file. Each version is on its own release."
          fi
          mkdir -p "$RUNNER_TEMP/feed"
          # Only a missing feed starts a new one: a failed download stops here, so a GitHub error never drops releases.
          assets=$(gh release view mac-updates --json assets --jq '.assets[].name')
          if grep -qx appcast.xml <<< "$assets"; then
            gh release download mac-updates --pattern appcast.xml --dir "$RUNNER_TEMP/feed"
          else
            echo "No feed yet: this run starts one."
          fi
          channel=beta
          if [ "$MODE" = release ]; then channel=release; fi
          out=$(node scripts/app-release.mjs mac-feed --file "$RUNNER_TEMP/mac/Relay-Everything-Mac.dmg" \
            --feed "$RUNNER_TEMP/feed/appcast.xml" --version "$VERSION" --build "$BUILD" --tag "$TAG" --channel "$channel" \
            --notes "$RUNNER_TEMP/whats-new.txt")
          echo "$out"
          files=("$RUNNER_TEMP/feed/appcast.xml")
          # An older build that finishes late keeps the newer file as the website's download.
          if [[ "$out" == *newest=true* ]]; then files+=("$RUNNER_TEMP/mac/Relay-Everything-Mac.dmg"); fi
          gh release upload mac-updates "${files[@]}" --clobber

  # Main's build that went to TestFlight goes to the public beta; a release never does. This job only starts
  # mobile-public-beta.yml, which waits for Apple in its own group, so main's next run does not wait behind it.
  public-beta:
    needs: [plan, ios]
    if: ${{ needs.plan.outputs.mode == 'beta' && needs.ios.outputs.sent == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the public beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          gh workflow run mobile-public-beta.yml --ref main -f version="$VERSION" -f build="$BUILD" -f sha="$GITHUB_SHA"

  # The fixed iPhone tour on a simulator, each step required, with no Claude.
  tour:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'release-check' }}
    # The device check's report jobs ask for these, and GitHub checks them even though a release skips both.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mobile-device-check.yml
    with:
      sha: ${{ github.sha }}
      tour_only: true

  # Runs only when every check above passed. Each step can run again for the same tag: the App Store review is not sent
  # twice, the GitHub release is edited, and each pull request gets one comment.
  release:
    needs: [plan, android, ios, macos, tour, web]
    if: ${{ needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'release-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes
        run: |
          node scripts/app-release.mjs notes --version "$VERSION" --previous-tag="$PREVIOUS_TAG" --out "$RUNNER_TEMP"
          if [ -z "$PREVIOUS_TAG" ]; then
            # The first release is the first file signed with the upload key: an earlier file can not update to it.
            printf '\n%s\n' "**Android:** if your phone has the app from an earlier file, send your notes first, then remove the app once and install this file. Notes that are only on the phone go with the app." >> "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/ios
      # The page from the tagged commit goes before the build, so both go live together. A release check sends none.
      - name: App Store page
        working-directory: mobile/ios
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::A release needs the App Store Connect key: add$missing to this repository's secrets. See mobile/README.md."
            exit 1
          fi
          check=false
          if [ "$MODE" = release-check ]; then check=true; fi
          bundle exec fastlane listing version:"$VERSION" verify_only:"$check"
      - name: App Store review
        working-directory: mobile/ios
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::A release needs the App Store Connect key: add$missing to this repository's secrets. See mobile/README.md."
            exit 1
          fi
          check=false
          if [ "$MODE" = release-check ]; then check=true; fi
          bundle exec fastlane submit version:"$VERSION" build:"$BUILD" notes:"$RUNNER_TEMP/whats-new.txt" check:"$check"
      - uses: actions/download-artifact@v4
        with:
          name: relay-everything-android-release
          path: ${{ runner.temp }}/apk
      - uses: actions/download-artifact@v4
        with:
          name: relay-web
          path: ${{ runner.temp }}/relay-web
      - name: GitHub release
        run: |
          # The Android file, and the web page with its SHA-256 for self-hosted servers.
          files=("$RUNNER_TEMP/apk/relay-everything-${VERSION}.apk" "$RUNNER_TEMP"/relay-web/*)
          title="Relay Everything ${VERSION}"
          notes="$RUNNER_TEMP/notes.md"
          if [ "$MODE" = release-check ]; then
            # A draft makes no tag. The last step deletes it.
            gh release create "$TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
            gh release view "$TAG" --json name,body,assets --jq '"\(.name): \([.assets[].name] | join(", "))\n\n\(.body)"'
          elif gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --latest --title "$title" --notes-file "$notes"
          fi
      # The Mac app passed mac-check in its own job, signed, accepted by Apple and stapled: no other file reaches here.
      - uses: actions/download-artifact@v4
        with:
          name: relay-everything-mac
          path: ${{ runner.temp }}/mac
      - name: Mac app on the GitHub release
        run: gh release upload "$TAG" "$RUNNER_TEMP/mac/Relay-Everything-Mac.dmg" --clobber
      - name: Mark the pull requests
        if: ${{ env.MODE == 'release' }}
        run: node scripts/app-release.mjs mark --version "$VERSION" --previous-tag="$PREVIOUS_TAG"
      - name: Delete the check's draft
        if: ${{ always() && env.MODE == 'release-check' }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
            echo "The check's draft release $TAG is deleted."
          fi
