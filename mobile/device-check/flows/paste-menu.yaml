# The iPhone's own text menu in a note, which the editor's web view shows: a hold on a word selects it and shows the
# menu with Copy; the cursor's menu has Select All, and its Paste puts the words back in. The copy comes from this app,
# so iOS asks no Allow Paste question here in any case: the device check's `xcrun simctl pbcopy` scenario checks that.
# A tap right of the title puts the cursor at its end, and a second tap on it opens the cursor's menu.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn: 'Notes(.|\n)*'
- tapOn: "New note"
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- inputText: "Paste check"
- longPressOn: "Paste check"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 30000
- takeScreenshot: paste-menu
- tapOn:
    point: "85%,20%"
- tapOn:
    point: "85%,20%"
- extendedWaitUntil:
    visible: "Select All"
    timeout: 30000
- tapOn: "Select All"
- tapOn: "Copy"
- tapOn:
    point: "85%,20%"
- tapOn:
    point: "85%,20%"
- extendedWaitUntil:
    visible: "Paste"
    timeout: 30000
- tapOn: "Paste"
- assertVisible: '(.|\n)*Paste(.|\n)*Paste(.|\n)*check(.|\n)*'
