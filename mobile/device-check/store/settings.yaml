# The App Store screenshot of Settings, signed out.
appId: com.matthewwong525.relayApp
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# The round gear has no visible words: Maestro finds it by its tooltip, Settings.
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 30000
- assertVisible: 'Sign in to Relay Everything(.|\n)*'
