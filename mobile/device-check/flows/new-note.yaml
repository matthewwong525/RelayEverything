# The Hold to talk tip on a fresh install, then a typed note: open Notes from Home, tap New note, type, Done, Back, and the note is in the list. Then search finds it.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# A fresh install has made no voice note yet, so a tip above New note says a hold talks.
- assertVisible: "Hold to talk"
# Home lists the folders; a row's label joins its name and its count, so match its start.
- tapOn: 'Notes(.|\n)*'
# A short tap on the round New note button opens a new note with the keyboard up. A hold of 0.5 s records.
- tapOn: "New note"
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- inputText: "Device check note"
- tapOn: "Done"
- takeScreenshot: note-reading
# The back button's label joins its tooltip, Back, and the folder it names, Notes.
- tapOn: 'Back(.|\n)*'
# Flutter joins a row's lines into one label, so match its start. A row has no tag.
- extendedWaitUntil:
    visible: 'Device check note(.|\n)*'
    timeout: 30000
- takeScreenshot: new-note
# Search the phone's notes: a match stays, no match says so, and Cancel brings back New note.
- tapOn: "Search"
- assertVisible: "Cancel"
- inputText: "check"
- assertVisible: 'Device check note(.|\n)*'
- inputText: " zzz"
- assertVisible: 'No notes with "check zzz"'
- tapOn: "Cancel"
- assertVisible: "New note"
- assertVisible: 'Device check note(.|\n)*'
