# Add a note from Apple Shortcuts: the app's own tile in the Shortcuts app asks for words, and the note is in the
# timeline. Not in the fixed tour: the Shortcuts app's screens change with each iOS, so run it by name.
appId: com.matthewwong525.relayApp
---
# The first open puts the app's actions in Shortcuts.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New note"
    timeout: 60000
- launchApp:
    appId: com.apple.shortcuts
- extendedWaitUntil:
    visible: "Relay Everything"
    timeout: 20000
- tapOn: "Relay Everything"
- tapOn: "Add a note to Relay Everything"
- extendedWaitUntil:
    visible: "What do you want to keep?"
    timeout: 20000
- inputText: "Shortcut check note"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Saved.*"
    timeout: 30000
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Typed"
    timeout: 10000
# Flutter joins a card's lines into one label, so match its start.
- assertVisible: 'Shortcut check note(.|\n)*'
- takeScreenshot: shortcut-note
