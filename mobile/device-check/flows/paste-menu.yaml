# The iPhone's own text menu in a note, which the editor's web view shows: the cursor's menu has Select All, the
# selection's has Copy, and Paste puts the words back in. A hold in words that can change moves the cursor with the
# magnifier, as in Notes, and selects nothing, so the check uses no hold. The copy comes from this app,
# so iOS asks no Allow Paste question here in any case: the device check's `xcrun simctl pbcopy` scenario checks that.
# A tap on the words puts the cursor there, and a second tap at the same place, on the cursor, opens its menu: a tap
# right of the line moves the cursor again and opens nothing.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn: 'Notes(.|\n)*'
- tapOn: "New note"
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- inputText: "Paste check"
- tapOn: "Paste check"
- tapOn: "Paste check"
- extendedWaitUntil:
    visible: "Select All"
    timeout: 30000
- takeScreenshot: paste-menu
- tapOn: "Select All"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 30000
- tapOn: "Copy"
- tapOn: "Paste check"
- tapOn: "Paste check"
- extendedWaitUntil:
    visible: "Paste"
    timeout: 30000
- tapOn: "Paste"
- assertVisible: '(.|\n)*Paste(.|\n)*Paste(.|\n)*check(.|\n)*'
