# Settings: open it from the ⋯ menu; sending is off, and its groups and switches are there.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Notes"
    timeout: 60000
# The round ⋯ button has no visible words: Maestro finds it by its tooltip, More.
- tapOn: "More"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Sending"
    timeout: 10000
- assertVisible: "Voice notes"
# Flutter joins a row's title and subtitle into one label, so match its start.
- assertVisible: 'Send my notes(.|\n)*'
- assertVisible: 'Pin notes to where I am(.|\n)*'
- takeScreenshot: settings
