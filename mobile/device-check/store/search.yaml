# The App Store screenshot of a search on Home that finds one note.
appId: com.matthewwong525.relayApp
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn: "Search"
- inputText: "trail"
- extendedWaitUntil:
    visible: 'Idea for the weekend(.|\n)*'
    timeout: 30000
- takeScreenshot: search
