# A voice note from a hold on New note: the recording fills the screen, a tap in the middle saves, and the X at the top
# right keeps nothing. Not in the fixed tour: it needs the speech model and a microphone, so a check names it: `--flows voice-note`.
appId: com.matthewwong525.relayApp
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- longPressOn: "New note"
# With no speech model yet, the hold asks to get it first; then hold again.
- runFlow:
    when:
      visible: "Get the speech model?"
    commands:
      - tapOn: "Get it"
      - extendedWaitUntil:
          notVisible: "Getting the speech model.*"
          timeout: 100000
      - longPressOn: "New note"
# iOS asks for the microphone the first time.
- tapOn:
    text: "Allow|OK"
    optional: true
# Flutter joins the recording screen's lines into one label, such as "Listening\n0:34\nTap anywhere to save\nSaves by
# itself at 5:00", so match the words inside it.
- extendedWaitUntil:
    visible: '(.|\n)*Tap anywhere to save(.|\n)*'
    timeout: 30000
- assertVisible: '(.|\n)*Saves by itself at 5:00(.|\n)*'
- assertVisible: "Cancel"
- takeScreenshot: voice-recording
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    notVisible: '(.|\n)*Tap anywhere to save(.|\n)*'
    timeout: 30000
- assertNotVisible: "Hold to talk"
- takeScreenshot: voice-saved
# The saved note opens its own page, so start again from Home for the cancel.
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- longPressOn: "New note"
- extendedWaitUntil:
    visible: '(.|\n)*Tap anywhere to save(.|\n)*'
    timeout: 30000
# The X's label is Cancel.
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: '(.|\n)*Tap anywhere to save(.|\n)*'
    timeout: 30000
- assertVisible: "Home"
- takeScreenshot: voice-cancelled
