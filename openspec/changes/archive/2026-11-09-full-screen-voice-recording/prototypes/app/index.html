<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Everything: full-screen voice note</title>
<style>
  * { box-sizing: border-box; }
  :root { --paper: #F7F8F4; --card: #FFFFFF; --line: #E3E6DF; --ink: #121614; --muted: #5E6660; --accent: #0E7A5A; --on-accent: #FFFFFF;
    --accent-text: #0E7A5A; --accent-soft: #E1F2EA; --spark: #F5A524; --on-spark: #121614; --outer: #ECEEE8; }
  .dark { --paper: #0C110F; --card: #161D1A; --line: #26302B; --ink: #ECF3EE; --muted: #9AA8A0; --accent: #4CC79A; --on-accent: #06281A;
    --accent-text: #4CC79A; --accent-soft: #133328; --spark: #FFC24D; --on-spark: #121614; --outer: #1B2320; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--outer); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 12px 40px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .controls button { font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; background: var(--card); color: var(--ink); }
  .controls button.on { background: var(--ink); color: var(--paper); }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 2px 14px; line-height: 1.45; min-height: 38px; }
  .phone { width: 360px; max-width: 100%; height: 740px; margin: 0 auto; position: relative; background: var(--paper); border-radius: 32px;
    box-shadow: 0 0 0 1px var(--line), 0 20px 40px -20px rgba(0,0,0,.3); overflow: hidden; display: flex; flex-direction: column; user-select: none; }
  .status { height: 34px; flex: none; }
  .top { display: flex; align-items: center; padding: 2px 16px 0 10px; height: 44px; flex: none; color: var(--accent-text); font-size: 16px; font-weight: 550; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .large { padding: 4px 16px 10px; }
  .large h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .body { flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
  .gh { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 12px 2px 4px; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; }
  .rowx { padding: 11px 16px; position: relative; }
  .rowx + .rowx::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
  .rowx .t { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowx .m { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .kind { font-size: 11px; font-weight: 650; color: var(--accent-text); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .kind.voice { color: var(--on-spark); background: var(--spark); }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; display: flex; gap: 10px; align-items: center;
    background: linear-gradient(transparent, var(--paper) 20px); }
  .search { flex: 1; height: 48px; border-radius: 24px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 16px;
    font-size: 16px; color: var(--muted); box-shadow: 0 2px 10px -6px rgba(0,0,0,.3); }
  .compose-wrap { position: relative; flex: none; }
  .compose { width: 52px; height: 52px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--accent);
    color: var(--on-accent); box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); cursor: pointer; position: relative; touch-action: none; }
  .ring { position: absolute; inset: -6px; width: 64px; height: 64px; pointer-events: none; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke: var(--spark); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 189; stroke-dashoffset: 189; }
  .holding .ring circle { transition: stroke-dashoffset .5s linear; stroke-dashoffset: 0; }
  .tip { position: absolute; right: 0; bottom: 64px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 550;
    padding: 7px 12px; border-radius: 12px; white-space: nowrap; }
  .tip::after { content: ""; position: absolute; right: 20px; bottom: -5px; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
  .rec { position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .rec .bar-top { width: 100%; display: flex; justify-content: flex-end; padding: 44px 16px 0; }
  .x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 0 0 1px var(--line); }
  .rec .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .listen { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .listen .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--spark); }
  .clock { font-size: 72px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .bars { display: flex; align-items: center; gap: 5px; height: 72px; }
  .bars span { width: 6px; border-radius: 3px; background: var(--spark); height: 8px; transition: height .12s ease-out; }
  .save-line { font-size: 17px; font-weight: 550; color: var(--ink); padding-bottom: 54px; text-align: center; }
  .save-line small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .saved { position: absolute; left: 16px; right: 16px; bottom: 96px; background: var(--ink); color: var(--paper); padding: 12px 14px; border-radius: 12px; font-size: 14px; }
</style>
</head>
<body>
<main id="root">
  <div class="controls" id="screens"></div>
  <div class="controls" id="themes"></div>
  <p class="hint" id="hint"></p>
  <div class="phone" id="phone"></div>
</main>
<script>
  const ico = {
    back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
    compose: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
    mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
    x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  };
  const screens = [['first', 'Notes, first time'], ['later', 'Notes, after a voice note'], ['holding', 'Holding New note'], ['recording', 'Recording']];
  const hints = {
    first: 'Until your first voice note, a small tip says Hold to talk. Press and hold the button here to try it.',
    later: 'After your first voice note the tip goes, and New note looks as it does today.',
    holding: 'While you hold, an amber ring fills round the button. When it closes, the phone buzzes and the recording screen opens.',
    recording: 'The recording fills the screen. The bars move with your voice. Tap anywhere to save; tap X to keep nothing.',
  };
  let screen = 'first', dark = true, tipGone = false, timer = null, t0 = 0;
  const notes = [['Hello, just seeing if this works', '4:03 PM', '0:04'], ['Pick up the parcel before six', '1:20 PM', '0:08'], ['Paint colours for the hall', '9:02 AM', null]];
  function list() {
    return '<div class="status"></div><div class="top">' + ico.back + 'Home</div><div class="large"><h1>Notes</h1><div class="sub">19 notes · Synced</div></div>' +
      '<div class="body"><div class="gh">Today</div><div class="group">' + notes.map(([t, at, len]) => '<div class="rowx"><div class="t">' + t + '</div><div class="m">' + at + '</div>' +
      '<div class="m">' + (len ? '<span class="kind voice">Voice</span>' + len : '<span class="kind">Typed</span>') + ' · Sent</div></div>').join('') + '</div></div>' +
      '<div class="dock"><div class="search">' + ico.search + 'Search</div><div class="compose-wrap' + (screen === 'holding' ? ' holding' : '') + '">' +
      (screen === 'first' && !tipGone ? '<div class="tip">Hold to talk</div>' : '') +
      '<button class="compose" id="compose" aria-label="New note">' + ico.compose + '</button>' +
      '<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/></svg></div></div>';
  }
  function rec() {
    return '<div class="rec" id="rec"><div class="bar-top"><button class="x" id="x" aria-label="Cancel">' + ico.x + '</button></div>' +
      '<div class="mid"><span class="listen"><span class="dot"></span>Listening</span><div class="clock" id="clock">0:00</div>' +
      '<div class="bars" id="bars">' + '<span></span>'.repeat(17) + '</div></div>' +
      '<div class="save-line">Tap anywhere to save<small>Saves by itself at 5:00</small></div></div>';
  }
  function draw(msg) {
    clearInterval(timer);
    document.body.className = dark ? 'dark' : '';
    document.getElementById('screens').innerHTML = screens.map(([k, l]) => '<button class="' + (k === screen ? 'on' : '') + '" data-s="' + k + '">' + l + '</button>').join('');
    document.getElementById('themes').innerHTML = '<button class="' + (dark ? '' : 'on') + '" data-t="light">Light</button><button class="' + (dark ? 'on' : '') + '" data-t="dark">Dark</button>';
    document.getElementById('hint').textContent = hints[screen];
    const phone = document.getElementById('phone');
    phone.innerHTML = list() + (screen === 'recording' ? rec() : '') + (msg ? '<div class="saved">' + msg + '</div>' : '');
    if (screen === 'recording') {
      t0 = Date.now();
      timer = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        document.getElementById('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        const talk = 0.35 + 0.65 * Math.abs(Math.sin(Date.now() / 700));
        document.querySelectorAll('#bars span').forEach((b, i) => {
          const centre = 1 - Math.abs(i - 8) / 10;
          b.style.height = Math.max(8, 72 * centre * talk * (0.5 + Math.random() * 0.5)) + 'px';
        });
      }, 120);
      document.getElementById('x').onclick = (e) => { e.stopPropagation(); screen = tipGone ? 'later' : 'first'; draw('Nothing was kept.'); };
      document.getElementById('rec').onclick = () => { tipGone = true; screen = 'later'; draw('Voice note saved. Writing the words…'); };
    }
    const btn = document.getElementById('compose');
    if (btn && screen !== 'recording') {
      let hold = null;
      btn.onpointerdown = () => {
        btn.parentElement.classList.add('holding');
        hold = setTimeout(() => { hold = null; screen = 'recording'; draw(); }, 500);
      };
      const up = () => { if (hold) { clearTimeout(hold); hold = null; btn.parentElement.classList.remove('holding'); } };
      btn.onpointerup = up; btn.onpointerleave = up;
    }
  }
  document.getElementById('screens').onclick = (e) => { const k = e.target.dataset.s; if (k) { screen = k; if (k === 'first') tipGone = false; draw(); } };
  document.getElementById('themes').onclick = (e) => { const t = e.target.dataset.t; if (t) { dark = t === 'dark'; draw(); } };
  draw();
</script>
</body>
</html>
