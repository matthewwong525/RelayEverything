# The iPhone app: built on a Mac and signed with the saved certificate on every run; with upload, sent to TestFlight.
# mobile-ci.yml sets upload for main and a release only. Until the App Store Connect key and the certificate are in
# this repository's secrets, it ends with a notice, but a release or a release check fails.
name: Mobile iOS
on:
  workflow_call:
    inputs:
      mode:
        description: The run's mode from scripts/app-release.mjs version. A release fails on a missing secret.
        required: false
        type: string
        default: ""
      upload:
        description: Send the build to TestFlight. A push to main sends only when it is main's newest change to mobile/.
        required: false
        type: boolean
        default: false
      version:
        description: The version name, such as 1.1.0, from scripts/app-release.mjs version.
        required: true
        type: string
      build:
        description: The build number, the same for every app of one run.
        required: true
        type: string
    outputs:
      sent:
        description: "'true' when this run sent its build to TestFlight, else 'false'."
        value: ${{ jobs.testflight.outputs.sent }}

jobs:
  testflight:
    runs-on: macos-latest
    outputs:
      sent: ${{ steps.testflight.outcome == 'success' }}
    defaults:
      run:
        working-directory: mobile
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      MODE: ${{ inputs.mode }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build }}
    steps:
      # A release or a release check stops with the missing names, so the Android file never goes out alone.
      - name: App Store Connect key and certificate
        id: key
        working-directory: .
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = release ] || [ "$MODE" = release-check ]; then
            echo "::error::A release needs the iPhone signing secrets: add${missing} to this repository's secrets. See mobile/README.md."
            exit 1
          else
            echo "::notice::No iPhone build: add${missing} to this repository's secrets (the certificate with node scripts/ios-signing-cert.mjs). See mobile/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ready == 'true'
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - uses: ruby/setup-ruby@v1
        if: steps.key.outputs.ready == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/ios
      # Writes the version, the build number and the pods, and compiles nothing: fastlane's archive compiles the app once.
      - name: Set up the build
        if: steps.key.outputs.ready == 'true'
        run: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      # A newer commit on main that changes the app has its own run, which sends: TestFlight never gets an older build
      # after a newer one. A newer change outside mobile/ does not count.
      - name: Newest on main
        id: newest
        if: steps.key.outputs.ready == 'true' && inputs.upload && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --quiet --depth=1 origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- mobile/; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A newer commit on main changes mobile/, and its own run sends the newer build. This build goes nowhere."
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign and check
        if: steps.key.outputs.ready == 'true' && (!inputs.upload || steps.newest.outputs.send == 'false')
        working-directory: mobile/ios
        run: bundle exec fastlane build
      - name: TestFlight
        id: testflight
        if: steps.key.outputs.ready == 'true' && inputs.upload && steps.newest.outputs.send != 'false'
        working-directory: mobile/ios
        run: bundle exec fastlane beta
