# The iPhone's own text menu in a note: a hold shows it, Select All and Copy take the words, and its Paste puts them
# back in. The copy comes from this app, so iOS asks no Allow Paste question here in any case: the device check's
# `xcrun simctl pbcopy` scenario checks paste with no question. After Select All a tap on the words only shows the menu
# again, so the check taps twice right of the title: the first tap puts the cursor at its end, the second opens the menu.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn: 'Notes(.|\n)*'
- tapOn: "New note"
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- inputText: "Paste check"
- longPressOn: "Paste check"
- extendedWaitUntil:
    visible: "Select All"
    timeout: 30000
- takeScreenshot: paste-menu
- tapOn: "Select All"
- tapOn: "Copy"
- tapOn:
    point: "85%,20%"
- tapOn:
    point: "85%,20%"
- extendedWaitUntil:
    visible: "Paste"
    timeout: 30000
- tapOn: "Paste"
- assertVisible: '(.|\n)*Paste(.|\n)*Paste(.|\n)*check(.|\n)*'
