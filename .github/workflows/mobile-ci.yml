# The phone app in mobile/: test and build both apps. A branch sends nothing, main sends its newest build as a beta,
# and a v<x.y.z> tag on main releases the app (mobile/README.md). A pull request from a fork runs the tests only.
name: Mobile CI
on:
  push:
    branches: ['**']
    # GitHub reads no paths filter for a tag, so every release tag runs.
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/mobile-*.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-*.yml']
  workflow_dispatch:
    inputs:
      release_check:
        description: Run a release's every step, with a draft GitHub release that is deleted and no App Store review.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A same-repo pull request is already covered by its own push, as in test.yml. Main's runs go in order and keep only
# the newest waiting run; a tag has its own group, never cancelled.
concurrency:
  group: >-
    ${{ github.ref_type == 'tag' && format('mobile-release-{0}', github.ref_name)
    || format('mobile-ci-{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != github.event.repository.default_branch }}

jobs:
  # One build number for every run (github.run_number), and the version: the tag's for a release, else the next beta.
  # A bad tag, a tag off main, or a version not above the last release stops here, before any build.
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: plan
        env:
          RELEASE_CHECK: ${{ inputs.release_check }}
        run: |
          if ! out=$(node scripts/app-release.mjs version 2> "$RUNNER_TEMP/plan.err"); then
            echo "::error::$(cat "$RUNNER_TEMP/plan.err")"
            exit 1
          fi
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  flutter:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The Relay Everything page, the app built for the web, as the file a self-hosted server downloads
  # (app/self-host/SETUP.md): main adds it to its pre-release, and a release to the release. A branch's web build runs
  # in the app's own build (deploy.yml), so it does not run here.
  web:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the file is named for the newest commit that changed mobile/.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: node scripts/build-relay-web.mjs --zip "$RUNNER_TEMP/relay-web"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-web
          path: ${{ runner.temp }}/relay-web
          if-no-files-found: error

  # The page goes with main's Android pre-release. When a newer commit on main changes mobile/, the Android job sends
  # nothing, and the newer run sends both.
  web-beta:
    needs: [plan, web, android]
    if: ${{ needs.plan.outputs.mode == 'beta' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-web
          path: ${{ runner.temp }}/relay-web
      - name: Add the page to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: mobile-v${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/relay-web/* --clobber
          else
            echo "::notice::No pre-release $TAG: a newer commit on main changes mobile/, and its own run sends the page."
          fi

  # A branch publishes nothing, so its builds start with the tests; main and a release build after them. GitHub's
  # needs can't depend on the mode, so each build has two jobs.
  android-branch:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'branch' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-android.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  ios-branch:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'branch' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/mobile-ios.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      upload: false
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  android:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-android.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  ios:
    needs: [plan, flutter]
    if: ${{ needs.plan.outputs.mode != 'branch' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/mobile-ios.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      upload: true
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
    secrets: inherit

  # Main's build that went to TestFlight goes to the public beta; a release never does. This job only starts
  # mobile-public-beta.yml, which waits for Apple in its own group, so main's next run does not wait behind it.
  public-beta:
    needs: [plan, ios]
    if: ${{ needs.plan.outputs.mode == 'beta' && needs.ios.outputs.sent == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the public beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          gh workflow run mobile-public-beta.yml --ref main -f version="$VERSION" -f build="$BUILD" -f sha="$GITHUB_SHA"

  # The fixed iPhone tour on a simulator, each step required, with no Claude.
  tour:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'release-check' }}
    # The device check's report jobs ask for these, and GitHub checks them even though a release skips both.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mobile-device-check.yml
    with:
      sha: ${{ github.sha }}
      tour_only: true

  # Runs only when every check above passed. Each step can run again for the same tag: the App Store review is not sent
  # twice, the GitHub release is edited, and each pull request gets one comment.
  release:
    needs: [plan, android, ios, tour, web]
    if: ${{ needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'release-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes
        run: |
          node scripts/app-release.mjs notes --version "$VERSION" --previous-tag="$PREVIOUS_TAG" --out "$RUNNER_TEMP"
          if [ -z "$PREVIOUS_TAG" ]; then
            # The first release is the first file signed with the upload key: an earlier file can not update to it.
            printf '\n%s\n' "**Android:** if your phone has the app from an earlier file, send your notes first, then remove the app once and install this file. Notes that are only on the phone go with the app." >> "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/ios
      - name: App Store review
        working-directory: mobile/ios
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::A release needs the App Store Connect key: add$missing to this repository's secrets. See mobile/README.md."
            exit 1
          fi
          check=false
          if [ "$MODE" = release-check ]; then check=true; fi
          bundle exec fastlane submit version:"$VERSION" build:"$BUILD" notes:"$RUNNER_TEMP/whats-new.txt" check:"$check"
      - uses: actions/download-artifact@v4
        with:
          name: relay-everything-android-release
          path: ${{ runner.temp }}/apk
      - uses: actions/download-artifact@v4
        with:
          name: relay-web
          path: ${{ runner.temp }}/relay-web
      - name: GitHub release
        run: |
          # The Android file, and the web page with its SHA-256 for self-hosted servers.
          files=("$RUNNER_TEMP/apk/relay-everything-${VERSION}.apk" "$RUNNER_TEMP"/relay-web/*)
          title="Relay Everything ${VERSION}"
          notes="$RUNNER_TEMP/notes.md"
          if [ "$MODE" = release-check ]; then
            # A draft makes no tag. The last step deletes it.
            gh release create "$TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
            gh release view "$TAG" --json name,body,assets --jq '"\(.name): \([.assets[].name] | join(", "))\n\n\(.body)"'
          elif gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --latest --title "$title" --notes-file "$notes"
          fi
      - name: Mark the pull requests
        if: ${{ env.MODE == 'release' }}
        run: node scripts/app-release.mjs mark --version "$VERSION" --previous-tag="$PREVIOUS_TAG"
      - name: Delete the check's draft
        if: ${{ always() && env.MODE == 'release-check' }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
            echo "The check's draft release $TAG is deleted."
          fi
