# The iPhone device check: build the phone app for the simulator, open it on an iPhone, run the fixed tour, then let
# Claude try the change. It starts only by hand or by the "check on iPhone" label: wiki/development/device-check.md.
name: Mobile device check
on:
  # GitHub starts this by hand only once the file is on the default branch; before that, the label is the only start.
  workflow_dispatch:
    inputs:
      sha:
        description: The saved commit to check. The run fails if the branch head is a different commit.
        required: true
        type: string
      pr:
        description: The pull request that gets the report, if any.
        required: false
        type: string
      scenarios:
        description: What Claude tries, in plain words. Empty means the open change's phone app scenarios.
        required: false
        type: string
      model:
        description: The model Claude uses.
        required: false
        type: string
        default: claude-sonnet-5-5
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  iphone:
    # The label start runs only for a branch in this repository, so a fork's code never gets the key.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'check on iPhone'
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP_ID: com.matthewwong525.relayApp
      OUT: ${{ github.workspace }}/out
      EXPECTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check the commit
        run: |
          mkdir -p "$OUT"
          head=$(git rev-parse HEAD)
          echo "$head" > "$OUT/commit.txt"
          if [ "$head" != "$EXPECTED_SHA" ]; then
            echo could-not-check > "$OUT/verdict.txt"
            echo "The branch is at $head, not at the saved commit $EXPECTED_SHA. Save again, then start the check." > "$OUT/reason.txt"
            echo "::error::$(cat "$OUT/reason.txt")"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.12.1
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          zip="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Build for the simulator
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          if flutter pub get 2>&1 | tee "$OUT/build.log" && flutter build ios --simulator --debug 2>&1 | tee -a "$OUT/build.log"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            bash device-check/broken.sh "The app does not build for the simulator." "$OUT/build.log"
          fi

      - name: Open the app on an iPhone
        id: open
        if: steps.build.outputs.ok == 'true'
        run: bash mobile/device-check/iphone-open.sh

      - name: Fixed tour
        id: tour
        if: steps.open.outputs.ok == 'true'
        run: bash mobile/device-check/tour.sh

      - name: Claude's key
        id: key
        if: steps.tour.outputs.ok == 'true'
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != true ]; then echo "Claude skipped: no key" > "$OUT/claude-skipped.txt"; fi

      - name: Brief for Claude
        id: brief
        if: steps.key.outputs.ready == 'true'
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: bash mobile/device-check/brief.sh mobile/device-check/iphone.md

      - name: Claude tries the change
        if: steps.key.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        env:
          # Keeps the key out of every command Claude runs, so screen text can't send it anywhere.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          prompt: ${{ steps.brief.outputs.text }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's read-only token, so Claude gets no write token from the Claude GitHub app.
          github_token: ${{ github.token }}
          claude_args: >-
            --model ${{ steps.brief.outputs.model }}
            --max-turns 40
            --allowedTools "Bash(xcrun simctl:*),Bash(maestro:*),Read,Edit(./out/claude/**),Write(./out/claude/**)"
            --disallowedTools "Bash(xcrun simctl spawn:*)"

      - name: Stop the video
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/video.pid" ] || exit 0
          pid=$(cat "$RUNNER_TEMP/video.pid")
          kill -INT "$pid" 2>/dev/null || true
          for _ in $(seq 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done

      - name: Keep the phone's log
        if: always() && steps.open.outputs.ok == 'true'
        run: bash mobile/device-check/phone-log.sh

      - name: Report
        if: always()
        run: bash mobile/device-check/finish.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-check-iphone
          path: out/
          if-no-files-found: error
          retention-days: 14

  # Posts the report on the pull request. It checks out no branch code, so the write token never shares a machine
  # with it: the same split as deploy.yml.
  report:
    needs: iphone
    if: ${{ always() && needs.iphone.result != 'skipped' && (inputs.pr || github.event.pull_request.number) }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: device-check-iphone
          path: result

      - name: Post the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then echo "::error::pr must be a pull request number."; exit 1; fi
          {
            if [ -f result/report.md ]; then head -c 60000 result/report.md; else echo "The iPhone check made no report. Open the run."; fi
            echo
            echo "Pictures and video: [the run]($RUN_URL), file \`device-check-iphone\`."
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
