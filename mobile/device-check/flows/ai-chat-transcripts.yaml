# AI chat transcripts: on a fresh install, Home's Other connections section has the row, and it opens a page with the
# steps to save Claude Code and Codex chats. Signed out, the page shows no link to the chats. Not in the fixed tour:
# run it by name.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# The section sits below On this phone, so scroll to it. A row's label joins its name and its line. The row counts as
# seen while the search bar still covers it, so center it and scroll to the list's end: a tap there would open Search.
- scrollUntilVisible:
    element:
      text: 'AI chat transcripts(.|\n)*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- scroll
- assertVisible: 'Other connections(.|\n)*'
- assertVisible: 'AI chat transcripts(.|\n)*Claude Code and Codex(.|\n)*'
- takeScreenshot: home-other-connections
- tapOn: 'AI chat transcripts(.|\n)*'
- extendedWaitUntil:
    visible: '(.|\n)*saves your Claude Code and Codex chats word for word(.|\n)*'
    timeout: 30000
# Flutter joins the numbered steps into one label, so match each line inside it. Each command is its own text.
- assertVisible: '(.|\n)*In Claude Code, type these commands to add the plugin:(.|\n)*'
- assertVisible: '(.|\n)*Or, for Codex, run these commands in a terminal:(.|\n)*'
- assertVisible: "/plugin install relay@relay"
- assertVisible: "codex plugin add relay@relay"
- assertNotVisible: "Read them on the web"
- takeScreenshot: ai-chat-transcripts
# The connect step is lower on the page.
- scrollUntilVisible:
    element:
      text: "/relay:connect"
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: '(.|\n)*In Claude Code or Codex, type this command:(.|\n)*Then click Connect\.(.|\n)*'
- assertNotVisible: "Read them on the web"
- takeScreenshot: ai-chat-transcripts-connect
