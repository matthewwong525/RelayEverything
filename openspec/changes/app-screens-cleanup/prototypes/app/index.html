<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Everything app, like Apple Notes</title>
<style>
  * { box-sizing: border-box; }
  :root { --paper: #F7F8F4; --card: #FFFFFF; --line: #E3E6DF; --ink: #121614; --muted: #5E6660; --accent: #0E7A5A; --on-accent: #FFFFFF;
    --accent-text: #0E7A5A; --accent-soft: #E1F2EA; --spark: #F5A524; --on-spark: #121614; --danger: #C9302C; --outer: #ECEEE8; }
  .dark { --paper: #0C110F; --card: #161D1A; --line: #26302B; --ink: #ECF3EE; --muted: #9AA8A0; --accent: #4CC79A; --on-accent: #06281A;
    --accent-text: #4CC79A; --accent-soft: #133328; --spark: #FFC24D; --on-spark: #121614; --danger: #FF8A80; --outer: #1B2320; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--outer); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 12px 40px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .controls button { font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; background: var(--card); color: var(--ink); }
  .controls button.on { background: var(--ink); color: var(--paper); }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 2px 14px; line-height: 1.45; }
  .phone { width: 360px; max-width: 100%; height: 740px; margin: 0 auto; position: relative; background: var(--paper); border-radius: 32px;
    box-shadow: 0 0 0 1px var(--line), 0 20px 40px -20px rgba(0,0,0,.3); overflow: hidden; display: flex; flex-direction: column; }
  .status { height: 34px; flex: none; }
  .top { display: flex; align-items: center; gap: 8px; padding: 2px 8px 0 16px; height: 44px; flex: none; }
  .top .small { font-size: 16px; font-weight: 650; }
  .back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent-text); font-size: 16px; font-weight: 550; margin-left: -6px; }
  .grow { flex: 1; }
  .icon { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); flex: none; border-radius: 50%; }
  .icon.bg { background: var(--card); width: 36px; height: 36px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .large { padding: 4px 16px 10px; flex: none; }
  .large h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .sub b { font-weight: 550; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.spark { background: var(--spark); }
  .dot.live { animation: beat 1.4s ease-out infinite; }
  .dot.hollow { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
  .dot.danger { background: var(--danger); }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 var(--spark); } 80% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .body { flex: 1; overflow-y: auto; padding: 0 16px 110px; display: flex; flex-direction: column; gap: 6px; }
  .body > * { flex-shrink: 0; }
  .gh { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 12px 2px 4px; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; }
  .rowx { display: flex; gap: 12px; padding: 11px 16px; position: relative; }
  .rowx + .rowx::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
  .rowx .t { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowx .p { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .rowx .p b { font-weight: 550; color: var(--ink); }
  .rowx .m { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .rowx .c { flex: 1; min-width: 0; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-soft), var(--line)); flex: none; align-self: center; }
  .kind { font-size: 11px; font-weight: 650; color: var(--accent-text); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .kind.voice { color: var(--on-spark); background: var(--spark); }
  .kind.big { font-size: 13px; padding: 4px 10px; }
  .meta { font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; display: flex; gap: 10px; align-items: center;
    background: linear-gradient(transparent, var(--paper) 20px); }
  .search { flex: 1; height: 48px; border-radius: 24px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 16px;
    color: var(--muted); box-shadow: 0 2px 10px -6px rgba(0,0,0,.3); }
  .search.on { color: var(--ink); box-shadow: 0 0 0 2px var(--accent-text); }
  .search svg.i { width: 18px; height: 18px; color: var(--muted); }
  .compose { width: 52px; height: 52px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 8px 18px -6px var(--accent); }
  .compose.live { background: var(--spark); color: var(--on-spark); box-shadow: 0 0 0 8px color-mix(in srgb, var(--spark) 30%, transparent); }
  .compose.half { background: linear-gradient(var(--spark), var(--spark)) bottom/100% 55% no-repeat, var(--accent); }
  .cancel { font: inherit; font-size: 15px; font-weight: 600; color: var(--accent-text); background: none; border: 0; padding: 0 2px; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .listen { position: absolute; left: 16px; right: 16px; bottom: 96px; background: var(--card); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }
  .listen .clock { font-size: 32px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .wave { display: flex; gap: 3px; align-items: center; height: 28px; }
  .wave span { width: 4px; border-radius: 2px; background: var(--spark); }
  .btn { font: inherit; font-size: 15px; font-weight: 650; border: 0; border-radius: 12px; padding: 10px 16px; background: var(--paper); color: var(--ink); }
  .menu { position: absolute; right: 12px; top: 80px; width: 250px; background: var(--card); border-radius: 14px; box-shadow: 0 12px 30px -8px rgba(0,0,0,.35); overflow: hidden; }
  .menu div { padding: 13px 16px; font-size: 16px; display: flex; align-items: center; gap: 12px; }
  .menu div + div { box-shadow: inset 0 1px 0 var(--line); }
  .menu svg.i { width: 20px; height: 20px; color: var(--muted); }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 0 28px 110px; }
  .empty h3 { margin: 6px 0 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
  .empty p { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.45; }
  .note { flex: 1; overflow-y: auto; padding: 4px 20px 30px; display: flex; flex-direction: column; gap: 14px; }
  .note .when { text-align: center; font-size: 13px; color: var(--muted); }
  .note p { font-size: 17px; line-height: 1.5; margin: 0; }
  .note .pic { height: 180px; border-radius: 14px; background: linear-gradient(135deg, var(--accent-soft), var(--line)); }
  .play { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 10px 14px 10px 10px; }
  .play .pb { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
  .play .track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .filerow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .write { flex: 1; padding: 4px 20px; font-size: 17px; line-height: 1.5; }
  .write b { font-size: 22px; font-weight: 700; display: block; margin-bottom: 4px; }
  .save { font: inherit; font-size: 15px; font-weight: 650; border: 0; border-radius: 12px; padding: 8px 16px; background: var(--accent); color: var(--on-accent); }
  .tool { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; flex: none; }
  .tool .icon { color: var(--ink); }
  .kb { height: 200px; background: var(--line); flex: none; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .gset { font-size: 13px; font-weight: 650; color: var(--muted); margin: 14px 4px 6px; }
  .set { background: var(--card); border-radius: 16px; padding: 4px 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .item .t { font-size: 16px; }
  .item .s { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .item.off .t, .item.off .s { opacity: .5; }
  .item.danger .t { color: var(--danger); }
  .foot { font-size: 13px; color: var(--muted); padding: 4px 16px 10px; }
  .switch { width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 24px; background: var(--on-accent); }
  .smallbtn { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--paper); border: 0; border-radius: 12px; padding: 8px 12px; flex: none; }
  .share { position: absolute; left: 8px; right: 8px; bottom: 8px; top: 60px; background: var(--paper); border-radius: 16px; display: flex; flex-direction: column; }
  .share .bar { display: flex; align-items: center; padding: 12px 8px; }
  .sharebody { padding: 4px 16px; display: flex; flex-direction: column; gap: 10px; }
  .field { background: var(--card); border-radius: 12px; padding: 12px; font-size: 16px; color: var(--muted); min-height: 80px; }
  .note-txt { font-size: 13px; color: var(--muted); margin: 12px auto 0; max-width: 360px; text-align: center; }
</style>
</head>
<body>
<main id="root">
  <div class="controls" id="screens"></div>
  <div class="controls" id="states"></div>
  <div class="hint" id="hint"></div>
  <div id="phone"></div>
  <p class="note-txt">A picture of the plan, drawn in HTML. The real app uses Inter; this page uses your device's font, because the font file is too large for this page.</p>
</main>
<script>
  const ico = {
    dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></svg>',
    gear: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
    sync: '<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',
    open: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>',
    mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    compose: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
    search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    play: '<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    clip: '<svg class="i" viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 17.5a2 2 0 0 1-3-3L14.5 7"/></svg>',
    file: '<svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
    x: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--line)" stroke="none"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  };
  const mark = (size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M13 42V7M13 7h11a8.5 8.5 0 0 1 0 17H13M22 24l11 17" stroke="var(--accent-text)"/>' +
    '<path d="M35.1 6.2a14.5 14.5 0 0 1 0 18.6M39.7 2.3a20.5 20.5 0 0 1 0 26.4" stroke="var(--spark)"/></svg>';

  const screens = [
    ['notes', 'Notes'], ['menu', '⋯ menu'], ['search', 'Search'], ['holding', 'Holding New note'], ['listening', 'Listening'],
    ['open', 'A note, opened'], ['compose', 'New note'], ['empty', 'First open'], ['settings', 'Settings'], ['settingsOn', 'Settings, sending on'], ['share', 'iPhone share sheet'],
  ];
  const syncStates = [['synced', 'Synced'], ['syncing', 'Syncing'], ['waiting', '2 waiting'], ['offline', 'Offline'], ['refused', 'Key refused'], ['local', 'On this phone']];
  const hints = {
    notes: 'Like Apple Notes: a large title, notes grouped by day, and one row per note: the first line, the time and the rest of the words, then its tag, length, place and send state. Search and New note sit at the bottom. Tap the states above.',
    menu: 'The ⋯ menu holds Settings, Sync now and Open your Relay Everything page. The gear and the card at the top of the list move here.',
    search: 'Type in Search and the list shows only the notes with those words, in their words, their place or their file names. It searches this phone only.',
    holding: 'Tap New note to write. Hold it: after half a second the phone gives a small buzz and the button turns into an amber mic.',
    listening: 'Then let go: the phone keeps listening. Tap anywhere to save the voice note, or tap Cancel. A voice note from Shortcuts or the Action button opens this same card.',
    open: 'Tap a row to read the whole note: its words, pictures, files and Play for a voice note. You read it here; you do not edit it.',
    compose: 'The New note page: a plain page like Apple Notes. The first line shows bold, as the row\'s title. Save is the one green button; the paperclip adds photos and files.',
    empty: 'The first open says what to do, above the button that does it.',
    settings: 'Three groups, each a card with no lines inside. With sending off, the three rows under it are dim, and one line says why.',
    settingsOn: 'With sending on, each row says when it last sent. The place, the server and Disconnect stay in the Sending card.',
    share: 'The iPhone share sheet gets the paper, the cards, the green Save and Inter, like the Android share card.',
  };
  let screen = 'notes', sync = 'synced', dark = matchMedia('(prefers-color-scheme: dark)').matches;

  const state = () => ({
    synced: '<span class="dot"></span><b>Synced</b>', syncing: '<span class="dot spark live"></span><b>Syncing</b>',
    waiting: '<span class="dot hollow"></span><b>2 waiting</b>', offline: '<span class="dot hollow"></span><b>Offline</b>',
    refused: '<span class="dot danger"></span><b>Key refused</b>', local: '<b>On this phone</b>',
  }[sync]);
  const topBar = () => '<div class="top">' + mark(24) + '<span class="grow"></span><span class="icon bg">' + ico.dots + '</span></div>';
  const large = (count) => '<div class="large"><h1>Notes</h1><div class="sub">' + count + ' · ' + state() + '</div></div>';
  const sent = (waiting) => sync === 'local' ? '' : (waiting || sync === 'waiting' || sync === 'offline' ? ' · Waiting to send' : ' · Sent');
  const row = (t, time, p, kind, meta, thumb) => '<div class="rowx"><div class="c"><div class="t">' + t + '</div><div class="p"><b>' + time + '</b>  ' + p + '</div>' +
    '<div class="m"><span class="kind' + (kind === 'Voice' ? ' voice' : '') + '">' + kind + '</span>' + meta + '</div></div>' + (thumb ? '<span class="thumb"></span>' : '') + '</div>';
  const all = [
    ['Today', [
      ['Ask Sam if the trip moves to the 14th', '9:41', 'and book the train after.', 'Voice', '0:12 · Home', false, false],
      ['Receipt for the desk lamp', '8:05', 'warranty.pdf, 1 photo', 'Typed', 'Office', true, false],
    ]],
    ['Yesterday', [['Paint colours for the hall', '18:05', 'the warm grey, not the blue.', 'Typed', 'Home', true, true]]],
    ['Previous 7 days', [
      ['Dentist moved to Thursday 3 pm', 'Wed', 'Bring the insurance card.', 'Typed', 'Work', false, false],
      ['Gift ideas for Mum', 'Mon', 'the pottery class, or the walk at Lynn Canyon.', 'Voice', '0:31', false, false],
    ]],
  ];
  function list(filter) {
    let html = '';
    for (const [g, rows] of all) {
      const shown = rows.filter((r) => !filter || (r[0] + r[2]).toLowerCase().includes(filter));
      if (!shown.length) continue;
      html += '<div class="gh">' + g + '</div><div class="group">' + shown.map((r) => row(r[0], r[1], r[2], r[3], ' · ' + r[4] + sent(r[6]), r[5])).join('') + '</div>';
    }
    return html;
  }
  const dock = (mode) => '<div class="dock"><div class="search' + (mode === 'search' ? ' on' : '') + '">' + ico.search +
    (mode === 'search' ? '<span style="flex:1">dentist</span>' + ico.x : '<span>Search</span>') + '</div>' +
    (mode === 'search' ? '<button class="cancel">Cancel</button>' : '<button class="compose' + (mode === 'holding' ? ' half' : mode === 'listening' ? ' live' : '') + '">' +
    (mode === 'holding' || mode === 'listening' ? ico.mic : ico.compose) + '</button>') + '</div>';
  const notesScreen = (extra) => topBar() + large('5 notes') + '<div class="body">' + list('') + '</div>' + dock(extra || '');

  function settings(on) {
    const item = (t, s, sw, cls) => '<div class="item' + (cls || '') + '"><div class="grow"><div class="t">' + t + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>' +
      (sw === null ? '' : '<span class="switch' + (sw ? ' on' : '') + '"></span>') + '</div>';
    return '<div class="top"><span class="back">' + ico.back + 'Notes</span><span class="grow"></span></div><div class="large"><h1>Settings</h1></div><div class="body" style="gap:0;padding-bottom:30px">' +
      '<div class="gset">Notes</div><div class="set">' + item('Pin notes to where I am', 'Each typed note keeps where you were.', true) + '</div>' +
      '<div class="gset">Voice notes</div><div class="set"><div class="item"><div class="grow"><div class="t">Speech model</div><div class="s">On this phone, 57 MB. Your voice never leaves it.</div></div><button class="smallbtn">Remove</button></div></div>' +
      '<div class="gset">Sending</div><div class="set">' +
      item('Send my notes', on ? 'To Relay Everything: relay.example.com.' : 'Off: nothing leaves this phone.', on) +
      item('Health', on ? 'Sent 14:05 · none waiting' : 'Steps, heart rate, sleep and more.', on, on ? '' : ' off') +
      item('Calendar', on ? 'Sent 14:02 · none waiting' : 'Your phone\'s calendars.', false, on ? '' : ' off') +
      item('Location history', on ? 'Sent 14:05 · 3 points waiting' : 'Where you go, also while the app is closed.', on, on ? '' : ' off') +
      (on ? item('Where the phone sends', 'Relay Everything', null) + item('Server', 'relay.example.com', null) + item('Disconnect this phone', 'Removes the key. Your notes stay here.', null, ' danger')
          : '<div class="foot">Health, Calendar and Location history work with Send my notes on.</div>') + '</div></div>';
  }
  function render() {
    document.getElementById('root').className = dark ? 'dark' : '';
    document.body.className = dark ? 'dark' : '';
    document.getElementById('screens').innerHTML = screens.map(([k, l]) => '<button data-s="' + k + '" class="' + (k === screen ? 'on' : '') + '">' + l + '</button>').join('') +
      '<button data-d="1" class="' + (dark ? 'on' : '') + '">Dark</button>';
    const showSync = ['notes', 'menu', 'empty', 'open'].includes(screen);
    document.getElementById('states').innerHTML = showSync ? syncStates.map(([k, l]) => '<button data-y="' + k + '" class="' + (k === sync ? 'on' : '') + '">' + l + '</button>').join('') : '';
    document.getElementById('hint').textContent = hints[screen];
    let inner = '';
    if (screen === 'notes') inner = notesScreen();
    if (screen === 'holding') inner = notesScreen('holding');
    if (screen === 'menu') inner = notesScreen() + '<div class="scrim" style="background:rgba(0,0,0,.12)"></div><div class="menu">' +
      '<div>' + ico.gear + 'Settings</div>' + (sync !== 'local' ? '<div>' + ico.sync + 'Sync now</div><div>' + ico.open + 'Open your Relay Everything page</div>' : '') + '</div>';
    if (screen === 'search') inner = topBar() + '<div class="body" style="padding-top:4px">' + list('dentist') + '</div><div class="kb" style="order:3">Keyboard</div>' +
      '<div style="position:relative;height:84px;flex:none;order:2">' + dock('search') + '</div>';
    if (screen === 'listening') {
      const bars = [8, 14, 22, 12, 26, 18, 10, 20, 28, 16, 9, 22, 14, 24, 11, 18, 26, 12, 8, 16].map((h) => '<span style="height:' + h + 'px"></span>').join('');
      inner = notesScreen('listening') + '<div class="scrim"></div><div class="listen"><div class="row" style="display:flex;align-items:center;gap:10px">' +
        '<span class="kind voice big">Listening</span><span class="grow"></span><button class="btn">Cancel</button></div><div class="clock">0:07</div><div class="wave">' + bars + '</div>' +
        '<div class="meta">Tap anywhere to save.</div></div>';
    }
    if (screen === 'open') inner = '<div class="top"><span class="back">' + ico.back + 'Notes</span><span class="grow"></span></div><div class="note">' +
      '<div class="when">Yesterday at 18:05 · Home</div><p><b>Paint colours for the hall</b><br>the warm grey, not the blue. Get a tester pot of each before Saturday.</p>' +
      '<div class="pic"></div><div class="filerow">' + ico.file + '<span class="grow">swatches.pdf</span><span class="meta">240 KB</span></div>' +
      '<div class="meta"><span class="kind">Typed</span>' + (sync === 'local' ? '' : '  Waiting to send') + '</div>' +
      '<div style="height:8px"></div><div class="when">A voice note shows Play:</div><div class="play"><span class="pb">' + ico.play + '</span><span class="track"></span><span class="meta">0:12</span></div></div>';
    if (screen === 'compose') inner = '<div class="top"><span class="back">' + ico.back + 'Notes</span><span class="grow"></span><button class="save">Save</button></div>' +
      '<div class="write"><b>Ideas for Mum\'s birthday</b>the pottery class, or the walk at Lynn Canyon.</div><div class="tool"><span class="icon">' + ico.clip + '</span><span class="meta">Add photo or file</span><span style="width:40px"></span></div><div class="kb">Keyboard</div>';
    if (screen === 'empty') inner = topBar() + large('No notes') + '<div class="empty">' + mark(56) + '<h3>No notes yet</h3><p>Tap New note to write one, or hold it to talk.</p>' +
      (sync === 'local' ? '<p>Notes stay on this phone until you turn on sending in Settings.</p>' : '') + '</div>' + dock('');
    if (screen === 'settings') inner = settings(false);
    if (screen === 'settingsOn') inner = settings(true);
    if (screen === 'share') inner = '<div style="flex:1;background:linear-gradient(var(--line),var(--outer))"></div><div class="scrim"></div><div class="share"><div class="bar">' +
      '<button class="btn" style="background:none">Cancel</button><span class="grow" style="text-align:center;font-weight:650">Relay Everything</span><button class="save">Save</button></div>' +
      '<div class="sharebody"><div class="card"><div style="font-weight:600">Hiking trails near Lynn Canyon</div><div class="meta">https://example.com/trails/lynn-canyon</div></div>' +
      '<div class="field">Add words</div><div class="meta">Sending is on: this goes to your space.</div></div></div>';
    document.getElementById('phone').innerHTML = '<div class="phone"><div class="status"></div>' + inner + '</div>';
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || !b.closest('.controls')) return;
    if (b.dataset.s) screen = b.dataset.s;
    if (b.dataset.y) sync = b.dataset.y;
    if (b.dataset.d) dark = !dark;
    render();
  });
  render();
</script>
</body>
</html>
