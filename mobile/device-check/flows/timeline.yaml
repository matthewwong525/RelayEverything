# Home and the notes list on a fresh install: the app opens on Home with sending off and no notes.
appId: com.matthewwong525.relayApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
# A row's label joins its name, its status and its count, so match inside it.
- assertVisible: 'Voice notes(.|\n)*'
- assertVisible: 'Location(.|\n)*Off(.|\n)*'
# Sign-in and connections live in Settings now, not on Home.
- assertNotVisible: 'Connections(.|\n)*'
# New note is a round button with no visible words: Maestro finds it by its accessibility label.
- assertVisible: "New note"
- assertVisible: "Search"
- takeScreenshot: home
- tapOn: 'Notes(.|\n)*'
# The count line joins the count and the state, such as "No notes · On this phone", so match the state inside it.
- extendedWaitUntil:
    visible: 'No notes yet(.|\n)*'
    timeout: 30000
- assertVisible: '(.|\n)*On this phone(.|\n)*'
- assertVisible: "New note"
- takeScreenshot: timeline
