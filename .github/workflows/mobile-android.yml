# The Android app, by mobile-ci.yml's mode: a file to try on a branch, for 64-bit ARM phones only; on main, a
# pre-release tagged mobile-v<version>+<build>; for a release, the signed file that mobile-ci.yml's release job uses.
name: Mobile Android
on:
  workflow_call:
    inputs:
      mode:
        description: branch, beta, release or release-check, from scripts/app-release.mjs version.
        required: true
        type: string
      version:
        description: The version name, such as 1.1.0.
        required: true
        type: string
      build:
        description: The build number, the same for every app of one run.
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - name: Upload key
        env:
          MODE: ${{ inputs.mode }}
          KEYSTORE: ${{ secrets.RELAY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELAY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELAY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELAY_ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing RELAY_ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing RELAY_ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELAY_ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELAY_ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            # A file signed with a debug key can never update to a signed one, so a release refuses it.
            if [ "$MODE" = release ] || [ "$MODE" = release-check ]; then
              echo "::error::A release needs the upload key: add$missing to this repository's secrets. See mobile/README.md."
              exit 1
            fi
            echo "::warning::No upload key in this repository's secrets (missing$missing), so this file is signed with a debug key and will not install over a release."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      # The speech package's CMake objects (its android/.cxx in the pub cache), its libraries, their NDK and Gradle's
      # build cache stay between runs. They come back after pub get, so pub never finds a half package folder.
      - name: NDK version and the Gradle build cache
        id: ndk
        working-directory: .
        run: |
          version=$(grep -oE 'ndkVersion: String = "[0-9.]+"' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | grep -oE '[0-9.]+' | tail -n 1)
          echo "version=${version:-none}" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/${version:-none}" >> "$GITHUB_OUTPUT"
          echo "org.gradle.caching=true" >> mobile/android/gradle.properties
      - name: Keep the speech build
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache/hosted/pub.dev/whisper_cpp_flutter_plus-*/android/.cxx
            mobile/build/whisper_cpp_flutter_plus/intermediates/cxx
            ${{ steps.ndk.outputs.path }}
            ~/.gradle/caches/build-cache-1
          key: >-
            android-native-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-ndk${{ steps.ndk.outputs.version }}-${{
            inputs.mode == 'branch' && 'arm64' || 'all' }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            android-native-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-ndk${{ steps.ndk.outputs.version }}-
      - name: Build
        id: apk
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          # A branch's file is for 64-bit ARM phones only, the phones it is tried on; main and a release have every kind.
          platforms=()
          if [ "$MODE" = branch ]; then platforms=(--target-platform android-arm64); fi
          flutter build apk --release "${platforms[@]}" --build-name="$VERSION" --build-number="$BUILD"
          case "$MODE" in
            release | release-check) file="relay-everything-${VERSION}.apk" ;;
            *) file="relay-everything-${VERSION}-${BUILD}.apk" ;;
          esac
          mv build/app/outputs/flutter-apk/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: File to try
        if: inputs.mode == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: relay-everything-android-${{ inputs.build }}
          path: mobile/${{ steps.apk.outputs.file }}
      # mobile-ci.yml's release job publishes this file only after the full test passes.
      - name: File for the release
        if: inputs.mode == 'release' || inputs.mode == 'release-check'
        uses: actions/upload-artifact@v4
        with:
          name: relay-everything-android-release
          path: mobile/${{ steps.apk.outputs.file }}
          if-no-files-found: error
      # A newer commit on main that changes the app has its own run, which publishes: the pre-releases never get an
      # older build after a newer one. A newer change outside mobile/ does not count.
      - name: Newest on main
        id: newest
        if: inputs.mode == 'beta'
        working-directory: .
        run: |
          git fetch --quiet --depth=1 origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- mobile/; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A newer commit on main changes mobile/, and its own run publishes the newer file. This file goes nowhere."
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi
      # A pre-release, never the latest release: the website's Android link opens the newest tagged release.
      - name: Pre-release
        if: inputs.mode == 'beta' && steps.newest.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          FILE: ${{ steps.apk.outputs.file }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "mobile-v${VERSION}+${BUILD}" "$FILE" --repo "$REPO" --target "$SHA" \
            --title "Relay Everything for Android ${VERSION}, build ${BUILD}" \
            --notes "A test build from main. Install this file on your Android phone. Built from ${SHA}." \
            --prerelease --latest=false
